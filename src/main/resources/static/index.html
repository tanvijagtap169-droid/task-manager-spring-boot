<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h2 class="mb-4">Task Manager</h2>

  <div class="row g-2 mb-4">
    <input type="hidden" id="taskId">
    <div class="col-md-3"><input id="title" class="form-control" placeholder="Title"></div>
    <div class="col-md-4"><input id="description" class="form-control" placeholder="Description"></div>
    <div class="col-md-2"><input id="dueDate" type="date" class="form-control"></div>
    <div class="col-md-2">
      <select id="status" class="form-select">
        <option>PENDING</option>
        <option>DONE</option>
      </select>
    </div>
    <div class="col-md-1"><button class="btn btn-primary w-100" onclick="saveTask()">Save</button></div>
  </div>

  <table class="table table-bordered">
    <thead class="table-light">
      <tr><th>ID</th><th>Title</th><th>Description</th><th>Due Date</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="taskTable"></tbody>
  </table>

<script>
const API = "/api/tasks";

async function loadTasks() {
  const res = await fetch(API);
  const tasks = await res.json();
  const body = document.getElementById("taskTable");
  body.innerHTML = "";
  tasks.forEach(t => {
    body.innerHTML += `<tr>
      <td>${t.id}</td><td>${t.title}</td><td>${t.description || ""}</td>
      <td>${t.dueDate || ""}</td>
      <td><span class="badge ${t.status === "DONE" ? "bg-success" : "bg-warning text-dark"}">${t.status}</span></td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick='editTask(${JSON.stringify(t)})'>Edit</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${t.id})">Delete</button>
      </td></tr>`;
  });
}

async function saveTask() {
  const id = document.getElementById("taskId").value;
  const task = {
    title: document.getElementById("title").value,
    description: document.getElementById("description").value,
    dueDate: document.getElementById("dueDate").value,
    status: document.getElementById("status").value
  };
  if (!task.title.trim()) { alert("Title is required"); return; }
  await fetch(id ? API + "/" + id : API, {
    method: id ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(task)
  });
  clearForm();
  loadTasks();
}

function editTask(t) {
  document.getElementById("taskId").value = t.id;
  document.getElementById("title").value = t.title;
  document.getElementById("description").value = t.description || "";
  document.getElementById("dueDate").value = t.dueDate || "";
  document.getElementById("status").value = t.status;
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) return;
  await fetch(API + "/" + id, { method: "DELETE" });
  loadTasks();
}

function clearForm() {
  ["taskId", "title", "description", "dueDate"].forEach(i => document.getElementById(i).value = "");
  document.getElementById("status").value = "PENDING";
}

loadTasks();
</script>
</body>
</html>
